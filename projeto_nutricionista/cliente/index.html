<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Agenda de Consultas</title>
</head>

<body>

    <center>

        <h1>Agenda de Consultas com Nutricionista</h1>

        <form action="http://127.0.0.1:3000" method="post">

            <input type="number" name="id" placeholder="ID" required>
            <br><br>

            <input type="date" name="data" required>
            <br><br>

            <input type="text" name="paciente" placeholder="Nome do paciente" required>
            <br><br>

            <input type="number" name="peso" placeholder="Peso em Kg" step="0.01" required>
            <br><br>

            <input type="number" name="altura" placeholder="Altura em metros" step="0.01" required>
            <br><br>

            <button type="reset">Limpar</button>

            <button type="submit">Cadastrar</button>

        </form>

    </center>

</body>

</html>
